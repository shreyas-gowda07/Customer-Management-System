
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Customer Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                linear-gradient(
                    rgba(5, 7, 13, 0.38),
                    rgba(5, 7, 13, 0.58)
                ),
                url("bg.jpg") center center / cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            color: #ffffff;
        }

        .register-container {
            width: 100%;
            max-width: 460px;
        }

        .register-card {
            width: 100%;
            padding: 36px 34px;
            background: rgba(15, 17, 25, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 55, 75, 0.16);
            border: 1px solid rgba(255, 90, 100, 0.65);
            color: #ff6978;
            font-size: 27px;
        }

        h1 {
            font-size: 29px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 9px;
        }

        .subtitle {
            color: #d0d1d8;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #f0f0f4;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s,
                        box-shadow 0.2s;
        }

        input::placeholder {
            color: #b8bac5;
        }

        input:focus {
            border-color: #ff596b;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(255, 65, 85, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 7px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #ff354f, #c91032);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 35, 65, 0.3);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .link-text {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            font-size: 13px;
            color: #d0d1d8;
        }

        .link-text a {
            color: #ff7583;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .link-text a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
                background-attachment: scroll;
            }

            .register-card {
                padding: 28px 22px;
                border-radius: 16px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="register-container">
        <section class="register-card">

            <header class="brand">
                <div class="brand-icon" aria-hidden="true">✦</div>
                <h1>Create Account</h1>
                <p class="subtitle">
                    Join our Customer Management System
                </p>
            </header>

            <form id="registerForm">

                <div class="form-group">
                    <label for="customer_name">Customer Name</label>
                    <input
                        type="text"
                        id="customer_name"
                        name="customer_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <input
                        type="text"
                        id="country"
                        name="country"
                        placeholder="Enter your country"
                        autocomplete="country-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" id="registerButton">
                    Create Account
                </button>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <p class="link-text">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </section>
    </main>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const customer_name =
                    document.getElementById("customer_name").value.trim();

                const country =
                    document.getElementById("country").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                const button =
                    document.getElementById("registerButton");

                message.textContent = "";
                button.disabled = true;
                button.textContent = "Creating account...";

                try {
                    const response = await fetch(`${API_URL}/register`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            customer_name: customer_name,
                            country: country,
                            email: email,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        message.style.color = "#86efac";
                        message.textContent =
                            "Registration successful! Redirecting to login...";

                        document.getElementById("registerForm").reset();

                        setTimeout(function() {
                            window.location.href = "login.html";
                        }, 1200);

                    } else {
                        message.style.color = "#ff929d";
                        message.textContent =
                            typeof data.detail === "string"
                                ? data.detail
                                : "Registration failed. Please check your details.";
                    }

                } catch (error) {
                    message.style.color = "#ff929d";
                    message.textContent =
                        "Cannot connect to the server. Make sure FastAPI is running.";

                    console.error("Registration error:", error);

                } finally {
                    button.disabled = false;
                    button.textContent = "Create Account";
                }
            });
    </script>

</body>
</html>
