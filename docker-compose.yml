
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: customer-backend-container
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: customer-frontend-container
    ports:
      - "8081:80"
    depends_on:
      - backend